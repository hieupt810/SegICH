[project]
name = "segich"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "nibabel>=5.4.2",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.5",
    "pynrrd>=1.1.3",
    "segmentation-models-pytorch>=0.5.0",
    "torch==2.5.0",
    "torchvision",
]

[dependency-groups]
dev = ["identify>=2.6.19", "pre-commit>=4.6.1", "ruff>=0.16.1"]

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu118"

[tool.ruff]
indent-width = 4
line-length = 100
target-version = "py312"

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

select = ["B", "E", "F", "I", "NPY", "RUF", "SIM", "UP"]
fixable = ["ALL"]

ignore = ["NPY002"]
unfixable = []

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false
